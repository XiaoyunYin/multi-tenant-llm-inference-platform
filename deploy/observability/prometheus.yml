global:
  scrape_interval: 500ms
  scrape_timeout: 400ms
  evaluation_interval: 500ms

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: [host.docker.internal:8080]

  - job_name: vllm
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8001
          - host.docker.internal:8002

  - job_name: dcgm
    static_configs:
      - targets: [dcgm-exporter:9400]
