apiVersion: v1
kind: ServiceAccount
metadata: {{- include "inference.metadata" (list . "gateway") | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {{- include "inference.metadata" (list . "endpoint-reader") | nindent 2 }}
rules:
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  verbs:
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {{- include "inference.metadata" (list . "gateway-endpoints") | nindent 2 }}
subjects:
- kind: ServiceAccount
  name: gateway
  namespace: {{ .Values.namespace }}
roleRef:
  kind: Role
  name: endpoint-reader
  apiGroup: rbac.authorization.k8s.io
