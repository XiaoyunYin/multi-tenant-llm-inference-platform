apiVersion: v1
kind: Service
metadata: {{- include "inference.metadata" (list . "gateway") | nindent 2 }}
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
  - name: http
    port: {{ .Values.ports.gateway }}
    targetPort: {{ .Values.ports.gateway }}
---
apiVersion: v1
kind: Service
metadata: {{- include "inference.metadata" (list . "gateway-peer") | nindent 2 }}
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
  - name: http
    port: {{ .Values.ports.gateway }}
    targetPort: {{ .Values.ports.gateway }}
  clusterIP: None
