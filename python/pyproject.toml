[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-tenant-inference-platform"
version = "0.1.0"
description = "Client and workload tooling for the multi-tenant LLM inference platform"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = []

[dependency-groups]
dev = [
    "jinja2==3.1.6",
    "msgspec==0.19.0",
    "pyzmq==27.1.0",
    "ruff==0.15.22",
    "tokenizers==0.22.2",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.setuptools.packages.find]
where = ["src"]
